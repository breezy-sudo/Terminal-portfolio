<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev_Terminal_v1/breezySudo</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <main id="terminal-container">

        <header id="terminal-header">
            <div class="terminal-buttons">
                <span class="button-close">&#9679;</span>
                <span class="button-minimize">&#9679;</span>
                <span class="button-maximize">&#9679;</span>
            </div>


            <h1 id="terminal-title">Dev_Terminal_v1 </h1>
        </header>

        <section id="terminal-body">
            <p id="boot-text">Visitor@portfolio:~$ help</p>

            <p id="input-line">
                <span class="prompt">>></span>
                <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false" />
            <div id="output"></div>
            </p>

        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
